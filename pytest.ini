[pytest]
testpaths = tests
addopts = -ra
markers =
    unitario: um componente isolado (funcao ou classe), com dubles no lugar do resto
    integracao: rota HTTP + servico + cliente do Gemini (duble)
    funcional: fluxos completos como o app (HydroBot) usa
    aceitacao: criterios de aceite das historias de usuario (BDD, arquivos .feature)
    desempenho: carga e volume
    seguranca: tentativas de ataque e de abuso
filterwarnings =
    ignore::DeprecationWarning
